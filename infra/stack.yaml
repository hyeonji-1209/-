AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  마음장부 — Cognito 로그인(이메일+비밀번호, 카카오 선택) + DynamoDB 한 테이블.
  배포: aws cloudformation deploy --template-file infra/stack.yaml --stack-name maeum-ledger
        --capabilities CAPABILITY_IAM --profile personal --region ap-northeast-2

Parameters:
  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/"
    Description: 카카오 로그인 뒤 돌아올 주소들 (배포 주소가 생기면 추가)
  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:3000/"
  KakaoClientId:
    Type: String
    Default: ""
    Description: 카카오 개발자 콘솔의 REST API 키. 비우면 카카오 로그인은 꺼진다. 동의항목은 닉네임만 있으면 된다.
  KakaoClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: 카카오 개발자 콘솔 > 보안 > Client Secret
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google Cloud 콘솔 OAuth 클라이언트 ID. 비우면 구글 로그인은 꺼진다.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true

  WithDomain:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 사용자 풀을 갈아끼울 때만 false 로 한 번 배포(도메인 이름을 그대로 쓰기 위해), 그 뒤 true 로 다시 배포

Conditions:
  HasKakao: !Not [!Equals [!Ref KakaoClientId, ""]]
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  WithDomain: !Equals [!Ref WithDomain, "true"]

Resources:
  # ── 로그인 ──────────────────────────────────────────
  # v3: 아이디(자유 문자열) + 비밀번호. 이메일을 받지 않으므로 가입 즉시 확정(PreSignUp 람다)하고,
  # 비밀번호 분실은 관리자가 admin-set-user-password 로 처리한다.
  UserPoolV3:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: maeum-ledger-v3
      UsernameConfiguration:
        CaseSensitive: false
      DeletionProtection: ACTIVE
      Schema:
        - Name: nickname
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      LambdaConfig:
        PreSignUp: !GetAtt AutoConfirmFn.Arn

  AutoConfirmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  AutoConfirmFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: maeum-ledger-auto-confirm
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt AutoConfirmRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            event.response.autoConfirmUser = true;
            return event;
          };

  AutoConfirmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoConfirmFn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPoolV3.Arn

  KakaoProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasKakao
    Properties:
      UserPoolId: !Ref UserPoolV3
      ProviderName: Kakao
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref KakaoClientId
        client_secret: !Ref KakaoClientSecret
        authorize_scopes: "openid profile_nickname"
        attributes_request_method: GET
        oidc_issuer: https://kauth.kakao.com
      AttributeMapping:
        username: sub
        nickname: nickname
        picture: picture

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPoolV3
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid profile"
      AttributeMapping:
        username: sub
        nickname: name
        picture: picture

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPoolV3
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes: [nickname, picture]
      WriteAttributes: [nickname, picture]
      SupportedIdentityProviders:
        - COGNITO
        - !If [HasKakao, !Ref KakaoProvider, !Ref AWS::NoValue]
        - !If [HasGoogle, !Ref GoogleProvider, !Ref AWS::NoValue]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      TokenValidityUnits:
        RefreshToken: days
      RefreshTokenValidity: 90

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: WithDomain
    Properties:
      Domain: !Sub "heartledger-${AWS::AccountId}"
      UserPoolId: !Ref UserPoolV3

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: maeum_ledger
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPoolV3.ProviderName

  # ── 데이터 ──────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: maeum-ledger
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # 로그인한 사람은 자기 pk(아이덴티티 ID) 아래 항목만 읽고 쓸 수 있다
  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-rows-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - "${cognito-identity.amazonaws.com:sub}"

  RoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthRole.Arn

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPoolV3
  UserPoolClientId:
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Value: !Ref IdentityPool
  TableName:
    Value: !Ref Table
  AuthDomain:
    Value: !Sub "heartledger-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  KakaoEnabled:
    Value: !If [HasKakao, "1", "0"]
  GoogleEnabled:
    Value: !If [HasGoogle, "1", "0"]
